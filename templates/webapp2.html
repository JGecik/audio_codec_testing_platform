<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Codec Testing Platform</title>
    <!-- Tailwind CSS pre moderný a čistý dizajn -->
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col items-center py-10 px-4">

<div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
    <!-- Head -->
    <h1 class="text-3xl font-extrabold text-blue-600 mb-2 text-center">Audio Codec Testing Platform</h1>
    <p class="text-gray-500 text-center mb-8">Codec conversion and analysis</p>

    <!-- Upload form -->
    <form id="uploadForm" class="space-y-6">
        <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-blue-500 transition-colors bg-gray-50">
            <input type="file" id="audioFile" name="file" accept="audio/*" required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
            <p class="text-xs text-gray-400 mt-2">Supported inputs: Lossless audio files</p>
        </div>

        <!-- Codec selection -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Choose conversion codecs:</label>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <label class="flex items-center space-x-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                    <input type="checkbox" name="codecs" value="mp3" checked class="rounded text-blue-600 focus:ring-blue-500">
                    <span>MP3</span>
                </label>
                <label class="flex items-center space-x-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                    <input type="checkbox" name="codecs" value="flac" checked class="rounded text-blue-600 focus:ring-blue-500">
                    <span>FLAC</span>
                </label>
                <label class="flex items-center space-x-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                    <input type="checkbox" name="codecs" value="ogg" checked class="rounded text-blue-600 focus:ring-blue-500">
                    <span>OGG (Opus)</span>
                </label>
                <label class="flex items-center space-x-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                    <input type="checkbox" name="codecs" value="wav" checked class="rounded text-blue-600 focus:ring-blue-500">
                    <span>WAV</span>
                </label>
                <label class="flex items-center space-x-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                    <input type="checkbox" name="codecs" value="aac" checked class="rounded text-blue-600 focus:ring-blue-500">
                    <span>AAC</span>
                </label>
                <label class="flex items-center space-x-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                    <input type="checkbox" name="codecs" value="wma" checked class="rounded text-blue-600 focus:ring-blue-500">
                    <span>WMA</span>
                </label>
            </div>
        </div>

        <!-- Button -->
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-md hover:shadow-lg">
            Start analysis and conversion
        </button>
    </form>

    <!-- Status text  -->
    <div id="statusText" class="mt-6 text-center font-medium text-gray-600 hidden"></div>

    <!-- Result box -->
    <div id="resultsSection" class="mt-10 hidden">
        <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Analysis results</h2>

        <!-- Og file -->
        <div id="originalInfo" class="bg-blue-50 rounded-xl p-4 mb-6 text-sm text-blue-900 grid grid-cols-2 sm:grid-cols-4 gap-4">

        </div>

        <!-- Table of da files -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-gray-100 text-gray-700 text-xs uppercase tracking-wider">
                    <th class="p-3 rounded-l-lg">Codec</th>
                    <th class="p-3">Lossless/Lossy?</th>
                    <th class="p-3">Bitrate</th>
                    <th class="p-3">Size in KB</th>
                    <th class="p-3">Save (%)</th>
                    <th class="p-3 rounded-r-lg">Download</th>
                </tr>
                </thead>
                <tbody id="resultsTableBody" class="divide-y divide-gray-100 text-sm">

                </tbody>
            </table>
        </div>

        <div class="bg-white border border-gray-100 rounded-xl p-4 mb-6 shadow-sm">
            <h3 class="text-sm font-semibold text-gray-700 mb-2">Waveforms</h3>
            <canvas id="waveformCanvas" class="w-full h-24 bg-gray-900 rounded-lg"></canvas>
        </div>
    </div>
</div>

<!-- JavaScript logic thingy-->
<script>
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const statusEl = document.getElementById('statusText');
        const resultsSection = document.getElementById('resultsSection');
        const submitBtn = document.getElementById('submitBtn');


        statusEl.classList.remove('hidden', 'text-red-600', 'text-green-600');
        statusEl.classList.add('text-blue-600');
        statusEl.textContent = "Loading...";

        resultsSection.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

        const formData = new FormData(this);

        try {
            const response = await fetch('/convert', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const errData = await response.json();

                statusEl.textContent = errData.detail || "Error converting file.";
                statusEl.classList.remove('text-blue-600');
                statusEl.classList.add('text-red-600');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                return;
            }

            const data = await response.json();




            statusEl.textContent = "File successfully analysed and converted";
            statusEl.classList.remove('text-blue-600');
            statusEl.classList.add('text-green-600');


            const orig = data.original;
            document.getElementById('originalInfo').innerHTML = `
                    <div><strong>Name:</strong> <br>${orig.name}</div>
                    <div><strong>Size:</strong> <br>${orig.size_kb} KB</div>
                    <div><strong>Length:</strong> <br>${orig.duration.toFixed(2)} s</div>
                    <div><strong>Bitrate:</strong> <br>${orig.bitrate} kbps</div>
                `;



            const tbody = document.getElementById('resultsTableBody');
            tbody.innerHTML = '';

            data.links.forEach(item => {
                const row = document.createElement('tr');
                row.className = "hover:bg-gray-50 transition-colors";
                row.innerHTML = `
                        <td class="p-3 font-semibold uppercase">${item.format}</td>
                        <td class="p-3"><span class="px-2 py-1 rounded text-xs ${item.type === 'lossless' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${item.type}</span></td>
                        <td class="p-3">${item.bitrate} kbps</td>
                        <td class="p-3">${item.size_kb} KB</td>
                        <td class="p-3 font-medium ${item.savings_percent > 0 ? 'text-green-600' : 'text-gray-600'}">${item.savings_percent}%</td>
                        <td class="p-3">
                            <a href="${item.url}" class="inline-block bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors" download>
                                Download
                            </a>
                        </td>
                    `;
                tbody.appendChild(row);
            });


            resultsSection.classList.remove('hidden');


            const canvas = document.getElementById('waveformCanvas');
            const ctx = canvas.getContext('2d');


            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            const waveforms = data.original.waveforms || [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (waveforms.length > 0) {
                ctx.fillStyle = '#3b82f6'; 
                const barWidth = canvas.width / waveforms.length;
                let x = 0;

                waveforms.forEach(val => {

                    const barHeight = Math.abs(val) * canvas.height;
                    ctx.fillRect(x, (canvas.height - barHeight) / 2, Math.max(barWidth - 0.5, 1), barHeight);
                    x += barWidth;
                });
            } else {
                ctx.fillStyle = '#9ca3af';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('No wave data', canvas.width / 2, canvas.height / 2);
            }


        } catch (error) {
            console.error("Connection error", error);
            statusEl.textContent = "Could not connect to the server.";
            statusEl.classList.remove('text-blue-600');
            statusEl.classList.add('text-red-600');
        } finally {
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    });
</script>
</body>
</html>
